<text class="t" x="62" y="364">At the three lighting conditions FMVSS 127 actually tests, every arm is under 16% of the limit:</text>
<text x="62" y="381"><tspan fill="#eb6834" font-weight="700">P_pts</tspan>   daylight 0.014×   dark lowbeam 0.023×   dark highbeam 0.015×</text>
