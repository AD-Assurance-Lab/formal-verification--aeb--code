<text x="62" y="413"><tspan fill="#2a78d6" font-weight="700">P_cont</tspan>   daylight 0.038×   dark lowbeam 0.153×   dark highbeam 0.033×</text>
<text class="s" x="62" y="433">Bars: peak over 10 runs with the plate. Black tick: the same illumination with the plate REMOVED. Hatched: the sub-interval the disturbance family cannot represent (A6).</text>
<text class="s" x="62" y="448">Gaps below the limit are run-to-run variation on demands far under it and decide nothing. The plate changes a verdict in exactly one place: P_cont at +0.01°, 0.906× → 1.105×.</text>
